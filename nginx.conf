# Nginx 配置 — 前端 /video/ 目录，后端 API 反代
# 放到 /etc/nginx/conf.d/video-agent.conf

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名

    # ====== 前端：/video/ 路径 ======
    location /video {
        alias /usr/local/nginx/html/video;
        index index.html;
        try_files $uri $uri/ /video/index.html;
    }

    # ====== 静态资源（头像、背景图） ======
    location /static/ {
        alias /usr/local/nginx/html/video/static/;
    }

    # ====== 后端 API 反代 ======
    location /video-api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ====== 视频/图片输出 ======
    location /output/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
    }
}
