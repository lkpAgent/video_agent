<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频生成智能体</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080812;--panel:#10101e;--panel-2:#151527;--surface:#1a1a2c;--border:rgba(167,170,255,.16);--text:#f4f4fb;--muted:#aaaac2;--subtle:#7f819c;--primary:#7c6cff;--primary-2:#b44cff}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(circle at 50% -20%,#17152c 0,var(--bg) 42%);color:var(--text);height:100vh;overflow:hidden}
#root{display:flex;height:100vh}
.sidebar{width:280px;background:linear-gradient(180deg,#111122,#0d0d19);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;box-shadow:12px 0 32px rgba(0,0,0,.18)}
.sidebar .logo{padding:19px 20px;font-size:17px;font-weight:800;letter-spacing:.4px;background:linear-gradient(135deg,#8b7cff,#c35cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;border-bottom:1px solid rgba(255,255,255,.05)}
.sidebar h2{padding:18px 20px 8px;font-size:11px;font-weight:700;letter-spacing:1.6px;color:#9698b5;text-transform:uppercase}
.mode-item{padding:11px 20px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;border-left:3px solid transparent;color:#c6c7db;transition:.18s ease}
.mode-item:hover{background:rgba(124,108,255,.09);color:#fff}
.mode-item.active{background:linear-gradient(90deg,rgba(124,108,255,.2),rgba(124,108,255,.04));border-left-color:#8376ff;color:#fff;font-weight:700}
.video-list{flex:1;overflow-y:auto;padding:8px 12px}
.video-card{padding:11px 10px;margin-bottom:7px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:8px;cursor:pointer;transition:.18s ease}
.video-card:hover{transform:translateX(2px);background:rgba(124,108,255,.1);border-color:rgba(124,108,255,.38)}
.video-card.selected{background:rgba(124,108,255,.14);border-color:rgba(124,108,255,.55)}
.video-card .v-title{font-size:12px;font-weight:600;color:#f0f0f8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-card .v-meta{font-size:10px;color:#9294af;margin-top:4px}
.video-card .v-meta-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.video-card .v-author{color:#b8b3e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;margin-right:4px;font-weight:600}
.tag-n{background:rgba(99,102,241,0.2);color:#a5b4fc}
.tag-s{background:rgba(168,85,247,0.2);color:#c4b5fd}
.tag-g{background:rgba(34,197,94,0.2);color:#86efac}
.main{flex:1 1 0;display:flex;flex-direction:column;overflow-y:auto;padding:30px 40px;background:linear-gradient(180deg,rgba(12,12,24,.7),rgba(8,8,18,.88))}
.main h1{font-size:21px;font-weight:800;margin-bottom:18px;letter-spacing:.3px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:#c7c8dc;margin-bottom:7px}
.fg input,.fg textarea,.fg select{width:100%;padding:10px 12px;background:#1a1a27;border:1px solid rgba(180,183,220,.28);border-radius:8px;color:#fff;font-size:13px;outline:none;font-family:inherit;transition:.18s ease}
.fg input::placeholder,.fg textarea::placeholder{color:#777990}
.fg input:hover,.fg textarea:hover,.fg select:hover{border-color:rgba(180,183,220,.46)}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:#8376ff;box-shadow:0 0 0 3px rgba(124,108,255,.14)}
.fg select option{background:#1a1a2e;color:#fff}
.fg textarea{resize:vertical;min-height:80px}
.fr{display:flex;gap:10px}.fr .fg{flex:1}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid rgba(183,185,220,.25);display:inline-flex;align-items:center;gap:6px;color:#c8c9db;margin:2px;background:rgba(255,255,255,.025);transition:.18s ease}
.chip:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.chip.on{background:rgba(124,108,255,.2);border-color:#8376ff;color:#e1ddff;font-weight:700;box-shadow:0 0 0 2px rgba(124,108,255,.08)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2)}
.chip.on .dot{background:#6366f1}
.bg-grid{display:flex;gap:8px;flex-wrap:wrap}
.bg-opt{width:64px;height:96px;border-radius:6px;cursor:pointer;border:2px solid transparent;overflow:hidden}
.bg-opt:hover{border-color:rgba(255,255,255,0.25)}
.bg-opt.on{border-color:#6366f1;box-shadow:0 0 8px rgba(99,102,241,0.25)}
.bg-opt .fill{width:100%;height:100%}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#6864f7,#ad49ed);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;transition:.18s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,0.3)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-s{padding:6px 14px;font-size:11px;width:auto;margin:2px;border-radius:6px}
.status{padding:10px 14px;background:rgba(255,255,255,0.02);border-radius:7px;font-size:12px;margin-top:10px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.2);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.preview{flex:1 1 0;background:linear-gradient(180deg,#10101e,#0d0d19);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.preview h2{padding:18px;font-size:13px;font-weight:700;color:#aeb0c8;border-bottom:1px solid rgba(255,255,255,.05)}
.player{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.player video{width:100%;border-radius:6px;max-height:65vh}
.placeholder{text-align:center;color:#777991;font-size:13px}
.placeholder .icon{font-size:40px;margin-bottom:8px;display:block}
.imgs{padding:8px 18px;border-top:1px solid rgba(255,255,255,0.05);max-height:130px;overflow-y:auto}
.imgs h3{font-size:10px;color:#9597b0;font-weight:700;margin-bottom:5px}
.imgs div{display:flex;flex-wrap:wrap;gap:4px}
.imgs img{width:56px;height:32px;object-fit:cover;border-radius:3px;border:1px solid rgba(255,255,255,0.08)}
.video-details{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.05);font-size:11px;color:rgba(255,255,255,0.55);max-height:220px;overflow-y:auto}
.video-details strong{color:#a5b4fc}.video-details .copy{margin-top:8px;white-space:pre-wrap;line-height:1.65;color:rgba(255,255,255,0.7)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#151525;border-radius:12px;padding:24px;width:460px;max-height:80vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.1)}

.modal .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.modal .row .info{flex:1}

.modal .row .acts{display:flex;gap:6px}
.sidebar-action{padding:11px 20px;font-size:11px;font-weight:600;color:#9fa1ba;cursor:pointer;transition:.18s ease}
.sidebar-action:hover{color:#fff;background:rgba(124,108,255,.08)}
.sidebar-action.first{border-top:1px solid rgba(255,255,255,.08)}
.footer-status{padding:10px 18px;font-size:11px;color:#8587a0;border-top:1px solid rgba(255,255,255,.05)}
</style>
<script>const API_BASE=window.location.hostname==='localhost'?'http://localhost:8888':'';</script>

<body><div id="root"></div>

<script type="text/babel">
const {useState,useEffect}=React;

const formatNarrationContent=(content)=>{
  if(!content)return "";
  if(content.includes("\n"))return content;
  return content.replace(/([。！？!?]+)(?=\S)/g,"$1\n");
};

const formatVideoTime=(value)=>{
  if(!value)return "时间未记录";
  const date=new Date(String(value).replace(" ","T"));
  if(Number.isNaN(date.getTime()))return String(value);
  return date.toLocaleString("zh-CN",{
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
  });
};

const BACKGROUNDS=[
  {name:"科技暗蓝",g:"linear-gradient(135deg,#0a0a1a,#1a1040,#0d1b2a)"},
  {name:"商务深灰",g:"linear-gradient(135deg,#1a1a1a,#2d2d2d,#1a1a2e)"},
  {name:"温暖金橙",g:"linear-gradient(135deg,#1a0f0a,#3d1a0a,#4e2d0a)"},
  {name:"清新翠绿",g:"linear-gradient(135deg,#0a1a0f,#0a2d1a,#0a3d2a)"},
  {name:"梦幻紫粉",g:"linear-gradient(135deg,#1a0a2e,#2d1a4e,#4e1a6e)"},
  {name:"纯黑",g:"#0a0a0f"},
];

const MODES=[
  {key:"narration",name:"口播视频",icon:"🎤"},
  {key:"science",name:"科普视频",icon:"🔬"},
  {key:"gallery",name:"图文展示",icon:"🖼️"},
];

const api={profiles:()=>fetch(`${API_BASE}/video-api/profiles`).then(r=>r.json()),
           saveProfile:p=>fetch(`${API_BASE}/video-api/profiles`+ (p.id?('/'+p.id):''),{method:p.id?'PUT':'POST',headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}),
           delProfile:id=>fetch(`${API_BASE}/video-api/profiles/`+id,{method:"DELETE"}),
           voices:()=>fetch(`${API_BASE}/video-api/voices`).then(r=>r.json()),
           saveVoice:v=>fetch(`${API_BASE}/video-api/voices`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)}),
           videos:()=>fetch(`${API_BASE}/video-api/videos`).then(r=>r.json()),
           uploadAvatar:fd=>fetch(`${API_BASE}/video-api/upload/avatar`,{method:"POST",body:fd}).then(r=>r.json()),
           generate:(type,payload)=>fetch(`${API_BASE}/video-api/generate/`+type,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json()),
           status:id=>fetch(`${API_BASE}/video-api/status/`+id).then(r=>r.json()),
           uploadImages:fd=>fetch(`${API_BASE}/video-api/upload/images`,{method:"POST",body:fd}).then(r=>r.json()),
           uploadBgm:fd=>fetch(`${API_BASE}/video-api/upload/bgm`,{method:"POST",body:fd}).then(r=>r.json()),
           bgmList:()=>fetch(`${API_BASE}/video-api/bgm-list`).then(r=>r.json()),
};

// ====== Settings Modal ======
function SettingsModal({profiles,voices,onClose,onRefresh}){
  const [editing,setEditing]=useState(null);
  const [name,setName]=useState("");const [company,setCompany]=useState("");
  const [slogan,setSlogan]=useState("");const [vid,setVid]=useState("");
  const [voiceType,setVoiceType]=useState(1);
  const [avatar,setAvatar]=useState("");
  const [showVoices,setShowVoices]=useState(false);

  const beginEdit=(p)=>{
    setEditing(p?p.id:"new");
    setName(p?p.name||"":"");setCompany(p?p.company||"":"");
    setSlogan(p?p.slogan||"":"");setVid(p?p.voice_id||"":"");
    setVoiceType(p?Number(p.voice_type||1):1);
    setAvatar(p?p.avatar||"":"");
  };

  const save=async()=>{
    if(!name.trim())return;
    const d={name,company,slogan,voice_id:vid,voice_type:voiceType,avatar};
    if(editing&&editing!=="new")d.id=editing;
    await api.saveProfile(d);
    setEditing(null);onRefresh();
  };

  const del=async(id)=>{await api.delProfile(id);onRefresh();};

  const vs=Array.isArray(voices)?voices:[];
  const voicename=(voice_id)=>{const v=vs.find(x=>x.voice_id===voice_id);return v?v.name:"未知";};
  const voiceLabel=(v)=>v.name+" · "+(Number(v.type||1)===2?"语音合成":"声音复刻");
  const toggleVoiceType=async(v)=>{
    await api.saveVoice({...v,type:Number(v.type||1)===2?1:2});
    onRefresh();
  };

  return React.createElement("div",{className:"modal-overlay",onClick:onClose},
    React.createElement("div",{className:"modal",onClick:e=>e.stopPropagation()},
      React.createElement("h3",null,"⚙️ 播主设置"),
      React.createElement("button",{className:"btn btn-s",style:{marginBottom:10,background:"rgba(255,255,255,0.08)"},onClick:()=>setShowVoices(!showVoices)},showVoices?"收起音色设置":"音色接口设置"),
      showVoices?React.createElement("div",{className:"fg",style:{padding:10,border:"1px solid rgba(99,102,241,0.25)",borderRadius:8,marginBottom:14}},
        React.createElement("label",null,"豆包音色接口类型（不是播主）"),
        ...vs.map(v=>React.createElement("div",{key:"voice-"+v.id,className:"row"},
          React.createElement("div",{className:"info"},
            React.createElement("div",{className:"name"},v.name),
            React.createElement("div",{className:"meta"},v.voice_id+" · "+(Number(v.type||1)===2?"语音合成 API":"声音复刻 API"))
          ),
          React.createElement("button",{className:"btn-s chip",onClick:()=>toggleVoiceType(v)},"切换类型")
        ))
      ):null,
      React.createElement("div",{style:{fontSize:11,color:"#aeb0c8",fontWeight:700,marginBottom:6}},"播主列表（"+profiles.length+"）"),
      ...profiles.map(p=>{
        if(!p||!p.id)return null;
        return React.createElement("div",{key:p.id,className:"row"},
          React.createElement("div",{className:"info"},
            React.createElement("div",{className:"name"},(p.name||"?")),
            React.createElement("div",{className:"meta"},(p.company||"")+" · "+(p.slogan||"")+" · 🎙️"+voicename(p.voice_id))
          ),
          React.createElement("div",{className:"acts"},
            React.createElement("button",{className:"btn-s chip",onClick:()=>beginEdit(p)},"编辑"),
            React.createElement("button",{className:"btn-s chip",onClick:()=>del(p.id),style:{color:"#ef4444"}},"删除")
          )
        );
      }),
      editing!==null?React.createElement("div",{style:{marginTop:12}},
        React.createElement("div",{className:"fg"},React.createElement("label",null,"名称"),React.createElement("input",{value:name,onChange:e=>setName(e.target.value)})),
        React.createElement("div",{className:"fr"},
          React.createElement("div",{className:"fg"},React.createElement("label",null,"公司"),React.createElement("input",{value:company,onChange:e=>setCompany(e.target.value)})),
          React.createElement("div",{className:"fg"},React.createElement("label",null,"Slogan"),React.createElement("input",{value:slogan,onChange:e=>setSlogan(e.target.value)}))
        ),
        React.createElement("div",{className:"fg"},React.createElement("label",null,"配音"),
          React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            ...vs.map(v=>React.createElement("div",{key:v.voice_id,className:"chip"+(vid===v.voice_id?" on":""),onClick:()=>{setVid(v.voice_id);setVoiceType(Number(v.type||1))}},React.createElement("span",{className:"dot"}),voiceLabel(v)))
          )
        ),
        React.createElement("div",{className:"fg"},React.createElement("label",null,"头像"),
          React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
            React.createElement("input",{type:"file",accept:"image/*",onChange:async e=>{const f=e.target.files[0];if(!f)return;const d=await api.uploadAvatar(new FormData());(new FormData()).append("file",f);const r=await fetch(`${API_BASE}/video-api/upload/avatar`,{method:"POST",body:new FormData()});e.target.form&&e.target.form.reset();}}),
            avatar?React.createElement("img",{src:API_BASE+avatar,style:{width:32,height:32,borderRadius:4,objectFit:"cover"}}):null
          )
        ),
        React.createElement("div",{style:{display:"flex",gap:8,marginTop:12}},
          React.createElement("button",{className:"btn btn-s",onClick:save},"💾 保存"),
          React.createElement("button",{className:"btn btn-s",onClick:()=>setEditing(null),style:{background:"rgba(255,255,255,0.1)"}},"取消")
        )
      ):React.createElement("button",{className:"btn",onClick:()=>beginEdit(null)},"➕ 新建播主"),
      React.createElement("button",{className:"btn",style:{marginTop:8,background:"rgba(255,255,255,0.08)"},onClick:onClose},"关闭")
    )
  );
}

// ====== App ======
function App(){
  const [mode,setMode]=useState("narration");
  const [profiles,setProfiles]=useState([]);const [voices,setVoices]=useState([]);
  const [videos,setVideos]=useState([]);const [showSettings,setShowSettings]=useState(false);
  const [generating,setGenerating]=useState(false);const [status,setStatus]=useState("");
  const [video,setVideo]=useState(null);const [title,setTitle]=useState("");const [images,setImages]=useState([]);
  const [selectedVideo,setSelectedVideo]=useState(null);
  const [optimizedContent,setOptimizedContent]=useState("");

  const refresh=async()=>{
    try{setProfiles((await api.profiles()).profiles||[])}catch(e){}
    try{setVoices((await api.voices()).voices||[])}catch(e){}
    try{setVideos((await api.videos()).videos||[])}catch(e){}
  };
  useEffect(()=>{refresh()},[]);

  const generate=async(payload)=>{
    setGenerating(true);setStatus("启动中...");setImages([]);setOptimizedContent("");
    try{
      const d=await api.generate(payload.type,payload);
      const id=setInterval(async()=>{
        const st=await api.status(d.task_id);
        setStatus(st.detail||st.status);if(st.images)setImages(st.images);if(st.title)setTitle(st.title);if(st.content)setOptimizedContent(st.content);
        if(st.status==="done"){clearInterval(id);setGenerating(false);setVideo(st.video);setStatus("✅完成");refresh();}
        else if(st.status==="error"){clearInterval(id);setGenerating(false);setStatus("❌"+(st.error||""));}
      },1500);
    }catch(e){setGenerating(false);setStatus("❌"+e.message)}
  };

  const play=(v)=>{
    setVideo(v.name);setTitle(v.title||v.name.replace(".mp4",""));
    setSelectedVideo(v);
    if(v.type)setMode(v.type);
  };

  return React.createElement(React.Fragment,null,
    // Sidebar
    React.createElement("div",{className:"sidebar"},
      React.createElement("div",{className:"logo"},"🎬 AI Video Agent"),
      React.createElement("h2",null,"视频模式"),
      ...MODES.map(m=>React.createElement("div",{key:m.key,className:"mode-item"+(mode===m.key?" active":""),onClick:()=>setMode(m.key)},React.createElement("span",null,m.icon),m.name)),
      React.createElement("h2",null,"📼 视频列表"),
      React.createElement("div",{className:"video-list"},
        ...videos.map(v=>React.createElement("div",{key:v.name,className:"video-card"+(video===v.name?" selected":""),onClick:()=>play(v)},
          React.createElement("div",{className:"v-title"},React.createElement("span",{className:"tag "+(v.type==="narration"?"tag-n":v.type==="gallery"?"tag-g":"tag-s")},v.type==="narration"?"口播":v.type==="gallery"?"图文":"科普"),v.title||v.name.replace(".mp4","")),
          React.createElement("div",{className:"v-meta"},formatVideoTime(v.time)),
          React.createElement("div",{className:"v-meta v-meta-row"},
            React.createElement("span",{className:"v-author"},"👤 "+(v.narrator_name||"播主未记录")),
            React.createElement("span",null,(v.size/1024/1024).toFixed(1)+"MB")
          )
        ))
      ),
      React.createElement("div",{className:"sidebar-action first",onClick:()=>setShowSettings(true)},"⚙️ 播主设置"),
    ),
    // Main
    React.createElement("div",{className:"main"},
      React.createElement("h1",null,MODES.find(m=>m.key===mode)?.icon+" "+MODES.find(m=>m.key===mode)?.name),
      mode==="narration"?React.createElement(NarrationForm,{profiles,onGenerate:generate,generating,selectedVideo,optimizedContent}):
      mode==="gallery"?React.createElement(GalleryForm,{profiles,onGenerate:generate,generating,selectedVideo}):
      React.createElement(ScienceForm,{profiles,onGenerate:generate,generating,selectedVideo}),
      generating?React.createElement("div",{className:"status"},React.createElement("span",{className:"spin"}),status):null
    ),
    // Preview
    React.createElement("div",{className:"preview"},
      React.createElement("h2",null,"▶️ 预览"),
      React.createElement("div",{className:"player"},
        video?React.createElement("video",{controls:true,autoPlay:true,src:`${API_BASE}/output/${video}`}):
        React.createElement("div",{className:"placeholder"},React.createElement("span",{className:"icon"},"🎥"),"选择视频播放")
      ),
      images.length>0?React.createElement("div",{className:"imgs"},React.createElement("h3",null,"🖼️ 图片"),React.createElement("div",null,...images.map((u,i)=>React.createElement("img",{key:i,src:API_BASE+u})))):null,
      selectedVideo?React.createElement("div",{className:"video-details"},
        React.createElement("div",null,React.createElement("strong",null,"播主："),selectedVideo.narrator_name||"未记录"),
        React.createElement("div",null,React.createElement("strong",null,"背景："),selectedVideo.background||selectedVideo.theme||"未记录"),
        selectedVideo.content?React.createElement("div",{className:"copy"},selectedVideo.type==="narration"?formatNarrationContent(selectedVideo.content):selectedVideo.content):null
      ):null,
      React.createElement("div",{className:"footer-status"},status+(title?" · "+title:""))
    ),
    showSettings?React.createElement(SettingsModal,{profiles,voices,onClose:()=>setShowSettings(false),onRefresh:refresh}):null
  );
}

// ====== Gallery Form ======
function GalleryForm({profiles,onGenerate,generating,selectedVideo}){
  const [topic,setTopic]=useState("");const [content,setContent]=useState("");
  const [pid,setPid]=useState("");
  const [galleryImages,setGalleryImages]=useState([]); // [{name,preview}]
  const [uploadedPaths,setUploadedPaths]=useState([]);
  const [bgmPath,setBgmPath]=useState("");const [bgmList,setBgmList]=useState([]);
  const [uploading,setUploading]=useState(false);
  const p=profiles.find(x=>x.id===pid)||{};

  useEffect(()=>{api.bgmList().then(d=>setBgmList(d.bgm||[]))},[]);
  useEffect(()=>{
    if(!selectedVideo||selectedVideo.type!=="gallery")return;
    setTopic(selectedVideo.topic||selectedVideo.title||"");
    setContent(selectedVideo.content||"");
    setPid(selectedVideo.profile_id||"");
    setBgmPath(selectedVideo.background||"");
  },[selectedVideo]);

  const handleImageSelect=async(e)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length)return;
    const previews=files.map(f=>({name:f.name,preview:URL.createObjectURL(f)}));
    setGalleryImages(prev=>[...prev,...previews]);
    setUploading(true);
    const fd=new FormData();
    files.forEach(f=>fd.append("files",f));
    try{const r=await api.uploadImages(fd);setUploadedPaths(prev=>[...prev,...(r.images||[])]);}
    catch(err){alert("图片上传失败: "+err.message)}
    setUploading(false);
    e.target.value="";
  };

  const removeImage=(idx)=>{
    setGalleryImages(prev=>prev.filter((_,i)=>i!==idx));
    setUploadedPaths(prev=>prev.filter((_,i)=>i!==idx));
  };

  const handleBgmUpload=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const fd=new FormData();fd.append("file",file);
    try{const r=await api.uploadBgm(fd);setBgmPath(r.path||"");setBgmList(prev=>[...prev,{name:file.name,path:r.path,url:r.url}]);}
    catch(err){alert("BGM上传失败: "+err.message)}
    e.target.value="";
  };

  const go=()=>{
    if(!pid||!p.id)return alert("请选择播主");
    if(!topic.trim())return alert("请输入视频标题");
    if(!content.trim())return alert("请输入视频文案内容");
    if(uploadedPaths.length===0)return alert("请至少上传一张图片");
    const payload={type:"gallery",title:topic.trim(),text:content.trim(),images:uploadedPaths,bgm:bgmPath,profile_id:p.id,name:p.name||"",company:p.company||"",slogan:p.slogan||"",avatar:p.avatar||"",voice_id:p.voice_id||"",voice_api_type:Number(p.voice_type||1)};
    onGenerate(payload);
  };

  return React.createElement("div",null,
    React.createElement("div",{className:"fg"},React.createElement("label",null,"👤 播主 / 音色"),
      React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        ...profiles.map(x=>React.createElement("div",{key:x.id,className:"chip"+(pid===x.id?" on":""),onClick:()=>setPid(x.id)},React.createElement("span",{className:"dot"}),x.name+(x.voice_id?" 🎙️":"")))
      )
    ),
    React.createElement("div",{className:"fg"},React.createElement("label",null,"🎬 视频标题"),React.createElement("input",{value:topic,onChange:e=>setTopic(e.target.value),placeholder:"例如：我的2024年度回顾"})),
    React.createElement("div",{className:"fg"},React.createElement("label",null,"📝 视频文案内容"),React.createElement("textarea",{value:content,onChange:e=>setContent(e.target.value),placeholder:"输入原始文字内容，生成时会由大模型按图片数量智能拆解为每页口播文案...",rows:8})),
    React.createElement("div",{className:"fg"},React.createElement("label",null,"🖼️ 上传图片（"+galleryImages.length+" 张）"),
      React.createElement("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}},
        ...galleryImages.map((img,i)=>React.createElement("div",{key:i,style:{position:"relative",width:80,height:100}},
          React.createElement("img",{src:img.preview,style:{width:"100%",height:"100%",objectFit:"cover",borderRadius:6,border:"1px solid rgba(255,255,255,0.12)"}}),
          React.createElement("button",{onClick:()=>removeImage(i),style:{position:"absolute",top:-6,right:-6,width:22,height:22,borderRadius:"50%",border:"none",background:"#ef4444",color:"#fff",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}},"✕")
        )),
        React.createElement("label",{style:{width:80,height:100,border:"2px dashed rgba(255,255,255,0.2)",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#9698b5",fontSize:24,transition:".18s"},onMouseOver:e=>e.target.style.borderColor="rgba(255,255,255,0.4)",onMouseOut:e=>e.target.style.borderColor="rgba(255,255,255,0.2)"},"+",React.createElement("input",{type:"file",accept:"image/*",multiple:true,onChange:handleImageSelect,style:{display:"none"}}))
      ),
      uploading?React.createElement("span",{style:{fontSize:11,color:"#9698b5"}},"⏳ 上传中..."):null
    ),
    React.createElement("div",{className:"fg"},React.createElement("label",null,"🎵 背景音乐（可选）"),
      React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}},
        React.createElement("div",{className:"chip"+(bgmPath===""?" on":""),onClick:()=>setBgmPath("")},"🔇 无BGM"),
        ...bgmList.map((b,i)=>React.createElement("div",{key:i,className:"chip"+(bgmPath===b.path?" on":""),onClick:()=>setBgmPath(b.path)},"🎵 "+b.name))
      ),
      React.createElement("label",{style:{display:"inline-block",padding:"6px 14px",border:"1px solid rgba(255,255,255,0.18)",borderRadius:6,fontSize:11,color:"#9698b5",cursor:"pointer",transition:".18s"},onMouseOver:e=>{e.target.style.borderColor="rgba(255,255,255,0.35)";e.target.style.color="#fff"},onMouseOut:e=>{e.target.style.borderColor="rgba(255,255,255,0.18)";e.target.style.color="#9698b5"}},"📁 上传BGM",React.createElement("input",{type:"file",accept:"audio/*",onChange:handleBgmUpload,style:{display:"none"}}))
    ),
    React.createElement("button",{className:"btn",onClick:go,disabled:generating||uploading},generating?"生成中...":uploading?"图片上传中...":"🚀 生成视频")
  );
}
